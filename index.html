<body>
  <!-- VERSION I49: NO #page-loader element is rendered, so it can never trap the user or block clicks. -->
  <main class="page">
    <article class="card" aria-labelledby="project-title">
      <div class="poster-wrap">
        <img class="poster" src="poster-mobile-800.webp" srcset="poster-mobile-800.webp 800w, poster-mobile-1000.webp 1000w" sizes="(max-width: 570px) 100vw, 570px" width="1000" height="562" alt="پوستر برنامه" loading="eager" decoding="async" fetchpriority="high" onerror="this.hidden=true">

        <section class="rules" id="rules-panel" aria-labelledby="rules-heading">
          <h2 id="rules-heading" class="rules-heading">قوانین و توضیحات</h2>

  <script>
(function(){
'use strict';
// VERSION I49: explicitly remove any stray full-page loader that could ever exist.
var overlay=document.getElementById('page-loader');if(overlay){overlay.remove();}
var htmlEl=document.documentElement;htmlEl.classList.remove('is-loading','flow-loading');

var promptActions=document.getElementById('prompt-actions');
var title=document.getElementById('project-title'), subtitle=document.getElementById('project-subtitle'), deadline=document.getElementById('deadline'), deadlineText=document.getElementById('deadline-text'), countdown=document.getElementById('countdown'), rules=document.getElementById('rules-content'), panel=document.getElementById('flow-panel'), heading=document.getElementById('flow-heading'), content=document.getElementById('flow-content'), status=null, next=document.getElementById('next-button'), rulesPanel=document.getElementById('rules-panel');
var state='intro',nationalId='',choice='',busy=false,registeredName=''; var endpoint='https://script.google.com/macros/s/AKfycbwxBI-cvDkR4GihzMtG_NB2jYS97bnctAj-hvCIvb6Dz4s6IlmWm97v6mvBkKtcPUnoKQ/exec';
function fa(v){return String(v).replace(/[0-9]/g,function(x){return '۰۱۲۳۴۵۶۷۸۹'[+x];});}
function ascii(v){return String(v).replace(/[۰-۹٠-٩]/g,function(x){var n=x.charCodeAt(0);return String(n>=1632&&n<=1641?n-1632:n-1776);});}
var backButton=document.getElementById('back');
function msg(t,err){ /* Flow-level notices are intentionally not shown beside unrelated fields. */ }
function rulesVisible(v){if(rulesPanel)rulesPanel.hidden=!v;}
function enter(titleText,html,s){var ra=document.getElementById('registration-actions');if(ra)ra.hidden=(s!=='registration');var cc=document.getElementById('choices-cancel-wrap'),sa=document.getElementById('selection-actions');if(cc)cc.hidden=(s!=='choices');if(sa)sa.hidden=(s!=='single-selection'&&s!=='full-selection');
  heading.textContent=titleText;
  content.innerHTML=html;
  promptActions.hidden=true;
  promptActions.innerHTML='';
  panel.hidden=false;
  rulesVisible(false);
  state=s;
  msg('');
  var actions=next.parentNode;
  actions.classList.toggle('nid-actions',s==='nid');
  backButton.hidden=s!=='nid';
  backButton.style.display=s==='nid'?'block':'none';
  next.hidden=(s==='prompt'||s==='registration');
  next.disabled=false;
  next.textContent=s==='nid'?'بررسی کد ملی':(s==='choices'?'ادامه':'ادامه');
  next.classList.toggle('nid-verify',s==='nid');
}
function back(){
  state='intro';
  panel.hidden=true;
  promptActions.hidden=true;
  promptActions.innerHTML='';
  rulesVisible(true);
  next.hidden=false;
  next.disabled=false;
  next.textContent='ادامه';
  next.classList.remove('nid-verify');
  next.parentNode.classList.remove('nid-actions');
  backButton.hidden=true;
  msg('');
  nationalId='';
  choice='';
}
// VERSION I49: Page 2 real <form>, submit handler sends JSONP action=verify (and registration branch sends action=register).
function validateField(input,feedback,kind){
 var value=input.value.trim(),valid=false,message='';
 if(kind==='nid'){value=ascii(value).replace(/\s/g,'');valid=/^\d{10}$/.test(value);message=valid?'آفرین، کد ملی را طبق نمونه وارد کردی.':'کد ملی را طبق نمونه وارد نکردی.';}
 else if(kind==='name'){valid=/^[\u0600-\u06FF]+(?:[ \u0600-\u06FF]+)*$/.test(value);message=valid?'آفرین، نام و نام خانوادگی را طبق نمونه وارد کردی.':'نام و نام خانوادگی را طبق نمونه وارد نکردی.';}
 else {value=ascii(value).replace(/[\s-]/g,'');valid=/^09\d{9}$/.test(value);message=valid?'آفرین، شماره همراه را طبق نمونه وارد کردی.':'شماره همراه را طبق نمونه وارد نکردی.';}
 input.classList.toggle('valid',valid);input.classList.toggle('invalid',!valid);feedback.className='field-feedback '+(valid?'success':'error');feedback.textContent=message;return valid;
}
function bindField(inputId,feedbackId,kind){var input=document.getElementById(inputId),feedback=document.getElementById(feedbackId);if(!input||!feedback)return;input.addEventListener('input',function(){validateField(input,feedback,kind);});input.addEventListener('blur',function(){validateField(input,feedback,kind);});return function(){return validateField(input,feedback,kind);};}
function start(){
enter('ورود کد ملی','<form id="nid-form" class="flow-form" novalidate><label class="flow-label" for="national-id">لطفاً کد ملی ۱۰ رقمی خود را وارد کنید.</label><input class="flow-input" id="national-id" name="nationalId" inputmode="numeric" autocomplete="off" placeholder="**********" maxlength="10" pattern="[0-9۰-۹٠-٩]{10}" dir="ltr" required><p class="field-feedback" id="national-id-feedback" aria-live="polite"></p></form>','nid');
next.parentNode.classList.add('nid-actions');
next.textContent='بررسی کد ملی';
next.classList.add('nid-verify');
var checkId=bindField('national-id','national-id-feedback','nid');document.getElementById('nid-form').addEventListener('submit',function(ev){ev.preventDefault();verify();});
var inp=document.getElementById('national-id');if(inp){inp.addEventListener('input',function(){var f=document.getElementById('national-id-feedback');if(f.textContent)validateField(inp,f,'nid');});inp.focus();}
}
function showRegisterPrompt(){
enter('ثبت‌نام جدید','<p class="flow-note">این کد ملی تاکنون در سامانه ثبت‌نام نشده است.</p><p class="flow-note national-id-display">کد ملی وارد شده: <strong dir="ltr">'+fa(nationalId)+'</strong></p><p class="flow-note">در سامانه ثبت‌نام نشده است. آیا مایل به ثبت‌نام هستید؟</p>','prompt');
promptActions.innerHTML='<button type="button" class="flow-button" id="edit-nid">ویرایش کد ملی</button><button type="button" class="flow-button primary" id="yes">بله، ثبت‌نام می‌کنم</button><button type="button" class="flow-button" id="no">خیر، بازگشت به قوانین</button>';promptActions.hidden=false;
document.getElementById('edit-nid').onclick=function(){var id=nationalId;start();var i=document.getElementById('national-id');i.value=fa(id);};document.getElementById('yes').onclick=function(){showRegistrationForm();};document.getElementById('no').onclick=back;
