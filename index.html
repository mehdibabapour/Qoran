<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="description" content="صفحه معرفی پروژه و نمایش تنظیمات">
  <title>معرفی پروژه</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#647087; --line:#e8ebf2; }
    * , *::before, *::after { box-sizing:border-box; font-family:Calibri,sans-serif; }
    button,input,textarea,select { font:inherit; }
    html { scroll-behavior:smooth; text-align:center; }
    body { margin:0; min-height:100vh; padding:calc(clamp(16px,4vw,42px) + env(safe-area-inset-top)) 14px calc(22px + env(safe-area-inset-bottom)); background:radial-gradient(ellipse at 50% -10%,#e9efff 0,transparent 48%),#f6f7fb; color:var(--ink); font-family:Calibri,sans-serif; -webkit-font-smoothing:antialiased; text-align:center; }
    .page { width:min(100%,760px); margin-inline:auto; }
    .card { overflow:hidden; background:#fff; border:1px solid rgba(226,231,241,.9); border-radius:24px; box-shadow:0 16px 48px rgba(27,43,77,.08); }
    .poster-wrap { padding:clamp(12px,3vw,22px); padding-bottom:0; }
    .poster { display:block; width:100%; max-width:100%; height:auto; max-height:min(58vh,620px); object-fit:contain; margin:auto; border-radius:16px; background:#f1f3f8; }
    .content { display:flex; flex-direction:column; align-items:center; padding:clamp(22px,5vw,42px); text-align:center; }
    h1 { width:100%; margin:0; font-size:clamp(1.55rem,5vw,2.25rem); line-height:1.55; font-weight:800; letter-spacing:-.03em; text-align:center; }
    .subtitle { width:100%; margin:10px 0 0; color:var(--muted); font-size:clamp(1rem,2.8vw,1.12rem); line-height:2; white-space:pre-line; text-align:center; }
    .rules { width:100%; margin-top:26px; padding:20px clamp(16px,4vw,24px); border:1px solid #e6eaf2; border-radius:18px; background:linear-gradient(145deg,#fbfcff,#f7f9fd); text-align:center; }
    .rules-heading { margin:0 0 10px; color:#34415a; font-size:1rem; font-weight:700; text-align:center; }
    .rules-content { color:#46536a; font-size:.98rem; line-height:2; white-space:pre-wrap; overflow-wrap:anywhere; text-align:center; direction:rtl; }
    .status { width:100%; min-height:27px; margin:15px 0 0; text-align:center; color:var(--muted); font-size:.88rem; line-height:1.8; }
    .status.error { color:#b42318; }
    .status:empty { display:none; }
    .action-row { display:flex; justify-content:center; width:100%; margin-top:18px; }
    .next { min-width:min(100%,220px); min-height:54px; padding:13px 28px; border:0; border-radius:15px; color:#fff; background:linear-gradient(135deg,#3b82f6,#1d4ed8); box-shadow:0 8px 18px rgba(37,99,235,.22); font:700 1.05rem Calibri,Tahoma,Arial,sans-serif; cursor:pointer; touch-action:manipulation; transition:transform .15s,box-shadow .15s,opacity .15s; text-align:center; }
    .next:not(:disabled):active { transform:translateY(1px) scale(.99); }
    .next:focus-visible { outline:3px solid #93c5fd; outline-offset:3px; }
    .next:disabled { cursor:not-allowed; opacity:.48; box-shadow:none; }
    .logo { display:block; width:min(100%,120px); max-height:100px; object-fit:contain; margin:18px auto 8px; }
    .version { margin:0; color:#8992a3; font-size:.8rem; line-height:1.7; text-align:center; }
    .loading-dot { display:inline-block; width:7px; height:7px; margin-inline:0 6px; border-radius:50%; background:#5b8def; animation:pulse 1s infinite alternate; vertical-align:middle; }
    @keyframes pulse { to { opacity:.25; transform:scale(.7); } }
    @media (min-width:700px) { .content { padding-top:34px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; animation-duration:.01ms!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <main class="page">
    <article class="card" aria-labelledby="project-title">
      <div class="poster-wrap">
        <img class="poster" src="poster.webp" alt="پوستر پروژه" fetchpriority="high" onerror="this.hidden=true">
      </div>
      <div class="content">
        <h1 id="project-title">در حال دریافت اطلاعات…</h1>
        <p id="project-subtitle" class="subtitle" hidden></p>
        <section class="rules" aria-labelledby="rules-heading">
          <h2 id="rules-heading" class="rules-heading">قوانین و توضیحات</h2>
          <div id="rules-content" class="rules-content">لطفاً چند لحظه صبر کنید.</div>
        </section>
        <p id="status" class="status" role="status" aria-live="polite"><span class="loading-dot" aria-hidden="true"></span>در حال بارگذاری تنظیمات…</p>
        <div class="action-row">
          <button id="next-button" class="next" type="button" disabled>ادامه</button>
        </div>
        <img id="project-logo" class="logo" src="logo.png" alt="لوگوی پروژه" onerror="this.hidden=true">
        <p class="version">index.html — VERSION ۱</p>
      </div>
    </article>
  </main>
  <script>
    (function () {
      'use strict';
      const ENDPOINT = 'https://script.google.com/macros/s/AKfycbx3sTXgmgyITdY8wCe1hskDtc-_oMn-mjEzZGZSZq--m23Kb4ngjGsDaltpz6MN4y_kwg/exec?callback=qoranReceiveSettings';
      const titleEl = document.getElementById('project-title');
      const subtitleEl = document.getElementById('project-subtitle');
      const rulesEl = document.getElementById('rules-content');
      const statusEl = document.getElementById('status');
      const nextButton = document.getElementById('next-button');
      let finished = false;
      let timeoutId;

      // Convert ASCII, Arabic-Indic and Persian digits to Persian digits.
      function persianDigits(value) {
        return String(value).replace(/[0-9٠-٩۰-۹]/g, function (digit) {
          const code = digit.charCodeAt(0);
          const number = code >= 48 && code <= 57 ? code - 48 : code >= 1632 && code <= 1641 ? code - 1632 : code - 1776;
          return '۰۱۲۳۴۵۶۷۸۹'[number];
        });
      }
      function convertTextNodes(root) {
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        let node;
        while ((node = walker.nextNode())) {
          const converted = persianDigits(node.nodeValue);
          if (converted !== node.nodeValue) node.nodeValue = converted;
        }
      }
      convertTextNodes(document.body);
      new MutationObserver(function (records) {
        records.forEach(function (record) {
          if (record.type === 'characterData') {
            const converted = persianDigits(record.target.nodeValue);
            if (converted !== record.target.nodeValue) record.target.nodeValue = converted;
          }
          record.addedNodes && record.addedNodes.forEach(function (node) {
            if (node.nodeType === Node.TEXT_NODE) {
              const converted = persianDigits(node.nodeValue);
              if (converted !== node.nodeValue) node.nodeValue = converted;
            } else if (node.nodeType === Node.ELEMENT_NODE) convertTextNodes(node);
          });
        });
      }).observe(document.body, {subtree:true, childList:true, characterData:true});

      function textValue(value) {
        if (value === null || value === undefined) return '';
        if (typeof value === 'string' || typeof value === 'number' || typeof value === 'boolean') return String(value).trim();
        if (typeof value === 'object' && !Array.isArray(value)) {
          for (const key of ['formattedValue','displayValue','value','text','content']) {
            if (Object.prototype.hasOwnProperty.call(value, key)) return textValue(value[key]);
          }
        }
        return '';
      }
      function normalizedKey(key) { return String(key).toLowerCase().replace(/[\s_-]/g, ''); }
      function lookupValue(obj, keys) {
        if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return {found:false, value:undefined};
        const lookup = Object.keys(obj).reduce(function (map, key) { map[normalizedKey(key)] = key; return map; }, {});
        for (const key of keys) {
          const actual = lookup[normalizedKey(key)];
          if (actual !== undefined) return {found:true, value:obj[actual]};
        }
        return {found:false, value:undefined};
      }
      function fromMatrix(value, row, col) {
        if (!Array.isArray(value) || value[row] === undefined) return {found:false, value:undefined};
        const rowValue = value[row];
        if (Array.isArray(rowValue)) {
          if (rowValue[col] !== undefined) return {found:true, value:rowValue[col]};
          // Also accept a single-column matrix whose first column represents B.
          if (rowValue.length === 1 && rowValue[0] !== undefined) return {found:true, value:rowValue[0]};
        } else if (rowValue !== null && rowValue !== undefined) {
          return {found:true, value:rowValue};
        }
        return {found:false, value:undefined};
      }
      function unwrap(payload) {
        let obj = payload;
        if (typeof obj === 'string') {
          try { obj = JSON.parse(obj); } catch (_) { return obj; }
        }
        const wrappers = ['data','settings','result','values'];
        for (let i = 0; i < 10 && obj && typeof obj === 'object' && !Array.isArray(obj); i++) {
          let next;
          for (const key of wrappers) {
            if (Object.prototype.hasOwnProperty.call(obj, key) && obj[key] !== null && obj[key] !== obj) { next = obj[key]; break; }
          }
          if (next === undefined) break;
          obj = next;
        }
        return obj;
      }
      function field(obj, keys, row, col) {
        const direct = lookupValue(obj, keys);
        if (direct.found && textValue(direct.value)) return direct;
        const matrix = fromMatrix(obj, row, col);
        return matrix.found ? matrix : direct;
      }
      function extract(payload) {
        const obj = unwrap(payload);
        const rules = field(obj, ['B4','rules','rule','instructions','law','laws'], 3, 1);
        const title = field(obj, ['B2','title','projectTitle','name'], 1, 1);
        const subtitle = field(obj, ['B3','subtitle','description','projectSubtitle'], 2, 1);
        const ok = !(obj && typeof obj === 'object' && obj.ok === false);
        const message = lookupValue(obj, ['message','error','detail']);
        return {
          ok: ok,
          message: message.found ? textValue(message.value) : '',
          title: title.found ? textValue(title.value) : '',
          subtitle: subtitle.found ? textValue(subtitle.value) : '',
          rules: rules.found ? rules.value : undefined
        };
      }
      function rulesText(value) {
        if (typeof value === 'string' || typeof value === 'number') return String(value);
        if (!Array.isArray(value)) return textValue(value);
        return value.map(function (line) {
          if (Array.isArray(line)) return line.map(textValue).filter(Boolean).join(' ');
          return textValue(line);
        }).filter(Boolean).join('\n');
      }
      function showError(message) {
        if (finished) return;
        finished = true;
        if (timeoutId) clearTimeout(timeoutId);
        titleEl.textContent = persianDigits('بارگذاری اطلاعات انجام نشد');
        rulesEl.textContent = persianDigits('اتصال به سرویس یا دریافت اطلاعات با مشکل روبه‌رو شد. لطفاً اتصال اینترنت را بررسی کنید و صفحه را دوباره بارگذاری کنید.');
        statusEl.className = 'status error';
        statusEl.textContent = persianDigits(message || 'دریافت تنظیمات ناموفق بود.');
      }
      window.qoranReceiveSettings = function (payload) {
        if (finished) return;
        const data = extract(payload);
        if (!data.ok) { showError(data.message || 'سرویس نتوانست تنظیمات را بخواند.'); return; }
        titleEl.textContent = persianDigits(data.title || 'عنوان پروژه');
        if (data.subtitle) { subtitleEl.textContent = persianDigits(data.subtitle); subtitleEl.hidden = false; }
        else subtitleEl.hidden = true;
        const ruleText = rulesText(data.rules).replace(/\r\n?/g, '\n').trim();
        finished = true;
        if (timeoutId) clearTimeout(timeoutId);
        if (ruleText) {
          rulesEl.textContent = persianDigits(ruleText);
          document.title = persianDigits(data.title || 'معرفی پروژه');
          nextButton.disabled = false;
          statusEl.textContent = '';
          statusEl.className = 'status';
        } else {
          rulesEl.textContent = persianDigits('قوانین در سلول B4 برگه seting ثبت نشده‌اند؛ لطفاً آن را بررسی کنید.');
          statusEl.className = 'status error';
          statusEl.textContent = persianDigits('قوانین ثبت نشده‌اند؛ ادامه غیرفعال است.');
          nextButton.disabled = true;
        }
      };
      const script = document.createElement('script');
      script.src = ENDPOINT + '&_=' + Date.now();
      script.async = true;
      script.onerror = function () { showError('ارتباط با سرویس برقرار نشد. لطفاً بعداً دوباره تلاش کنید.'); };
      document.head.appendChild(script);
      timeoutId = window.setTimeout(function () { showError('زمان دریافت اطلاعات به پایان رسید. لطفاً صفحه را دوباره بارگذاری کنید.'); }, 15000);
    }());
  </script>
</body>
</html>
