  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#647087; --line:#e8ebf2; }
    * , *::before, *::after { box-sizing:border-box; font-family:Calibri,'Segoe UI',Tahoma,sans-serif; }
    button,input,textarea,select { font:inherit; }
    html { font-size:17px; scroll-behavior:smooth; text-align:center; }
    body { margin:0; min-height:100vh; padding:calc(clamp(16px,4vw,42px) + env(safe-area-inset-top)) 14px calc(22px + env(safe-area-inset-bottom)); background:radial-gradient(ellipse at 50% -10%,#e9efff 0,transparent 48%),#f6f7fb; color:var(--ink); font-family:Calibri,'Segoe UI',Tahoma,sans-serif; font-weight:500; -webkit-font-smoothing:antialiased; text-align:center; }
    .page { width:min(100%,760px); margin-inline:auto; }
    .card { overflow:hidden; background:#fff; border:1px solid rgba(226,231,241,.9); border-radius:24px; box-shadow:0 16px 48px rgba(27,43,77,.08); }
    .poster-wrap { padding:clamp(12px,3vw,22px); padding-bottom:0; height:auto; aspect-ratio:auto; }
    .poster { display:block; width:100%; max-width:100%; height:auto; max-height:min(58vh,620px); object-fit:contain; margin:auto; border-radius:16px; background:#f1f3f8; }
    .content { display:flex; flex-direction:column; align-items:center; padding:clamp(22px,5vw,42px); text-align:center; }

    .subtitle { width:100%; margin:10px 0 0; color:var(--muted); font-size:clamp(1rem,2.8vw,1.12rem); font-weight:500; line-height:2; white-space:pre-line; text-align:center; }
    .deadline { display:block; width:min(100%,560px); margin:14px 0 0; padding:10px clamp(14px,3vw,20px); border:1px solid #414750; border-radius:12px; background:#252a31; color:#f5f6f8; font-size:clamp(.98rem,2.7vw,1.08rem); font-weight:700; line-height:1.8; text-align:center; direction:rtl; overflow-wrap:anywhere; }
    .deadline[hidden] { display:none; }
    .countdown { margin-top:5px; color:#fff; font-size:.96em; font-weight:700; }
    .countdown[hidden] { display:none; }
    /* Rules stay right-aligned/dir rtl as required. */
    .rules { width:100%; margin-top:26px; padding:20px clamp(16px,4vw,24px); border:1px solid #414750; border-radius:18px; background:#252a31; text-align:right; direction:rtl; }
    .rules-heading { margin:0 0 10px; color:#f5f6f8; font-size:1rem; font-weight:900; text-align:right; direction:rtl; font-family:Calibri,'Segoe UI',Tahoma,sans-serif; }
    .rules-content { color:#edf0f4; font-size:.98rem; font-weight:500; line-height:2; white-space:pre-wrap; overflow-wrap:anywhere; text-align:right; direction:rtl; font-family:Calibri,'Segoe UI',Tahoma,sans-serif; }
    .rules-loading-dots { display:inline-flex; direction:ltr; margin-inline-start:.15em; gap:.08em; vertical-align:baseline; }
    .rules-loading-dots span { display:inline-block; opacity:.22; animation:rules-dot-pulse 1.15s infinite ease-in-out; }
    .rules-loading-dots span:nth-child(2) { animation-delay:.18s; }
    .rules-loading-dots span:nth-child(3) { animation-delay:.36s; }
    @keyframes rules-dot-pulse { 0%,60%,100% { opacity:.22; transform:translateY(0); } 30% { opacity:1; transform:translateY(-.18em); } }
    .rules :is(p,li,ul,ol,div,span,strong,b,em) { color:#edf0f4 !important; text-align:right !important; direction:rtl !important; unicode-bidi:isolate; }

    .flow-content .flow-label { color:#edf0f4; font-family:Calibri,'Segoe UI',Tahoma,sans-serif; }
    .flow-content .flow-input { color:#172033; font-family:Calibri,'Segoe UI',Tahoma,sans-serif; }
    .flow-content .flow-help { color:#edf0f4; }

    .status.error { color:#b42318; }
    .status:empty { display:none; }
    .action-row { display:flex; justify-content:center; width:100%; margin-top:18px; }
    .next { min-width:min(100%,220px); min-height:54px; padding:13px 28px; border:0; border-radius:15px; color:#fff; background:linear-gradient(135deg,#3b82f6,#1d4ed8); box-shadow:0 8px 18px rgba(37,99,235,.22); font:900 1.05rem Calibri,'Segoe UI',Tahoma,sans-serif; cursor:pointer; touch-action:manipulation; transition:transform .15s,box-shadow .15s,opacity .15s; text-align:center; }
    .action-row.nid-actions { flex-direction:column; align-items:center; gap:12px; }
    .nid-back,.nid-verify { display:block; width:min(100%,420px); min-width:0; height:54px; min-height:54px; margin:0; flex:0 0 54px; }
    #back[hidden] { display:none !important; }
    .nid-back { color:#172033; background:#fff; border:1px solid #cbd5e1; box-shadow:none; }
    .next:not(:disabled):active { transform:scale(.97); opacity:.88; transition:transform .1s,opacity .1s; }
    .next:focus-visible { outline:3px solid #93c5fd; outline-offset:3px; }
    .next:disabled { cursor:not-allowed; opacity:.48; box-shadow:none; }
    .logo { display:block; width:min(100%,120px); max-height:100px; object-fit:contain; margin:18px auto 8px; background:transparent; }

    .version bdi { direction:ltr; unicode-bidi:isolate; }
    /* ---- VERSION I38: no loading overlay. The full-screen loader has been removed; nothing can block the page. ---- */

    /* VERSION I38 multi-step registration controls */
    .flow-form { width:100%; display:flex; flex-direction:column; align-items:center; gap:12px; margin-top:16px; }
    .flow-label { width:min(100%,420px); color:#edf0f4; font-weight:700; text-align:center; font-family:Calibri,'Segoe UI',Tahoma,sans-serif; }
    .flow-input { display:block; width:min(100%,420px); min-height:52px; padding:12px 16px; border:1px solid #cbd5e1; border-radius:12px; background:#fff; color:#172033; text-align:center; direction:ltr; outline:none; font-family:Calibri,'Segoe UI',Tahoma,sans-serif; }
    .flow-input:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.18); }
    .flow-input.invalid { border:2px solid #b42318; }
    .flow-input.valid { border:2px solid #15803d; }
    .field-feedback { width:min(100%,420px); min-height:1.4em; margin:-7px 0 2px; font-size:.88rem; line-height:1.5; }
    .field-feedback.error { color:#f87171; }
    .field-feedback.success { color:#4ade80; }
    .flow-note { margin:0; color:#edf0f4; line-height:1.8; text-align:center; font-family:Calibri,'Segoe UI',Tahoma,sans-serif; }
    .flow-actions { display:flex; flex-direction:column; align-items:center; gap:12px; width:min(100%,420px); margin:16px auto 0; }
    .flow-actions[hidden] { display:none !important; }
    .flow-actions .flow-button { display:block; width:100%; min-height:54px; }
    .registration-actions { margin-top:16px; }
    .prompt-actions { display:flex; flex-direction:column; align-items:center; gap:12px; width:100%; margin-top:14px; }
    .prompt-actions .flow-button { display:block; width:min(100%,420px); min-height:54px; }
    .prompt-actions[hidden] { display:none; }
    .flow-button { min-height:48px; padding:10px 18px; border:1px solid #cbd5e1; border-radius:12px; background:#fff; color:#172033; font-weight:800; cursor:pointer; text-align:center; font-family:Calibri,'Segoe UI',Tahoma,sans-serif; }
    .flow-button.primary { border-color:#1d4ed8; background:#1d4ed8; color:#fff; }
    .flow-button.selected { outline:3px solid #93c5fd; border-color:#1d4ed8; background:#eff6ff; color:#1d4ed8; }
    .flow-button:focus-visible { outline:3px solid #93c5fd; outline-offset:2px; }
    .next:focus,.flow-button.primary:focus { outline:3px solid #93c5fd; outline-offset:3px; }
    .next:active,.flow-button.primary:active { transform:scale(.97); opacity:.88; transition:transform .1s,opacity .1s; }

// VERSION I38: Page 2 real <form>, submit handler sends JSONP action=verify (and registration branch sends action=register).
function validateField(input,feedback,kind){
 var value=input.value.trim(),valid=false,message='';
 if(kind==='nid'){value=ascii(value).replace(/\s/g,'');valid=/^\d{10}$/.test(value);message=valid?'آفرین، کد ملی را طبق نمونه وارد کردی.':'کد ملی را طبق نمونه وارد نکردی.';}
 else if(kind==='name'){valid=/^[\u0600-\u06FF]+(?:[ \u0600-\u06FF]+)*$/.test(value);message=valid?'آفرین، نام و نام خانوادگی را طبق نمونه وارد کردی.':'نام و نام خانوادگی را طبق نمونه وارد نکردی.';}
 else {value=ascii(value).replace(/[\s-]/g,'');valid=/^09\d{9}$/.test(value);message=valid?'آفرین، شماره همراه را طبق نمونه وارد کردی.':'شماره همراه را طبق نمونه وارد نکردی.';}
 input.classList.toggle('valid',valid);input.classList.toggle('invalid',!valid);feedback.className='field-feedback '+(valid?'success':'error');feedback.textContent=message;return valid;
}
function bindField(inputId,feedbackId,kind){var input=document.getElementById(inputId),feedback=document.getElementById(feedbackId);if(!input||!feedback)return;input.addEventListener('input',function(){validateField(input,feedback,kind);});input.addEventListener('blur',function(){validateField(input,feedback,kind);});return function(){return validateField(input,feedback,kind);};}
function start(){
enter('ورود کد ملی','<form id="nid-form" class="flow-form" novalidate><label class="flow-label" for="national-id">لطفاً کد ملی ۱۰ رقمی خود را وارد کنید.</label><input class="flow-input" id="national-id" name="nationalId" inputmode="numeric" autocomplete="off" maxlength="10" pattern="[0-9۰-۹٠-٩]{10}" dir="ltr" required><p class="field-feedback" id="national-id-feedback" aria-live="polite"></p></form>','nid');

next.classList.add('nid-verify');

}
function showRegisterPrompt(){

promptActions.innerHTML='<button type="button" class="flow-button" id="edit-nid">ویرایش کد ملی</button><button type="button" class="flow-button primary" id="yes">بله، ثبت‌نام می‌کنم</button><button type="button" class="flow-button" id="no">خیر، بازگشت به قوانین</button>';promptActions.hidden=false;
document.getElementById('edit-nid').onclick=function(){var id=nationalId;start();var i=document.getElementById('national-id');i.value=fa(id);};document.getElementById('yes').onclick=function(){showRegistrationForm();};document.getElementById('no').onclick=back;
}
function showRegistrationForm(){
enter('تکمیل ثبت‌نام','<p class="flow-note">کد ملی: <strong dir="ltr">'+fa(nationalId)+'</strong></p><form id="reg-form" class="flow-form" novalidate><label class="flow-label" for="full-name">نام و نام خانوادگی</label><input class="flow-input" id="full-name" name="fullName" autocomplete="name" placeholder="مثال: علی رضایی" required><p class="field-feedback" id="full-name-feedback" aria-live="polite"></p><label class="flow-label" for="mobile">شماره تلفن همراه</label><input class="flow-input" id="mobile" name="mobile" inputmode="tel" autocomplete="tel" placeholder="مثال: 09123456789" required><p class="field-feedback" id="mobile-feedback" aria-live="polite"></p></form>','registration');document.getElementById('registration-actions').hidden=false;document.getElementById('back-prompt').onclick=showRegisterPrompt;var checkName=bindField('full-name','full-name-feedback','name'),checkMobile=bindField('mobile','mobile-feedback','mobile');document.getElementById('reg-form').addEventListener('submit',function(ev){ev.preventDefault();register();});
}
function showChoices(){

var nameBox=content.querySelector('.participant-name strong'),edit=content.querySelector('.edit-name'),editor=content.querySelector('.name-editor'),input=content.querySelector('.name-edit-input'),options=content.querySelector('.flow-actions');nameBox.textContent=registeredName;input.value=registeredName;
edit.style.cssText='background:#ffc107;color:#000';edit.onclick=function(){if(!editor.hidden){var v=input.value.trim();if(!/^[\u0600-\u06FF]+(?:[ \u0600-\u06FF]+)*$/.test(v)){input.focus();return;}registeredName=v;nameBox.textContent=v;editor.hidden=true;options.classList.remove('editing');edit.textContent='ویرایش نام';edit.setAttribute('aria-pressed','false');edit.style.cssText='background:#ffc107;color:#000';return;}editor.hidden=false;options.classList.add('editing');edit.textContent='اتمام ویرایش';edit.setAttribute('aria-pressed','true');edit.style.cssText='background:#20c997;color:#000';input.focus();};
