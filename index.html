        if (data.subtitle) { subtitleEl.textContent = persianDigits(data.subtitle); subtitleEl.hidden = false; }
        else subtitleEl.hidden = true;
        if (data.deadline) { deadlineTextEl.textContent = persianDigits('مهلت ثبت‌نام: ' + data.deadline); deadlineTextEl.dataset.rawDeadline = data.deadline; deadlineEl.hidden = false; startCountdown(data.deadline); }
        else { deadlineTextEl.textContent = ''; deadlineTextEl.dataset.rawDeadline = ''; deadlineEl.hidden = true; stopCountdown(); countdownEl.hidden = true; countdownEl.textContent = ''; }
        const ruleText = rulesText(data.rules).replace(/\r\n?/g, '\n').trim();
        finished = true;
        if (timeoutId) clearTimeout(timeoutId);
        if (ruleText) {
          rulesEl.textContent = persianDigits(ruleText);
          document.title = persianDigits(data.title || 'معرفی پروژه');
          nextButton.disabled = false;
          statusEl.textContent = '';
          statusEl.className = 'status';
          requestAnimationFrame(function () { requestAnimationFrame(hidePageLoader); });
        } else {
          rulesEl.textContent = persianDigits('قوانین در سلول B4 برگه seting ثبت نشده‌اند؛ لطفاً آن را بررسی کنید.');
          statusEl.className = 'status error';
          statusEl.textContent = persianDigits('قوانین ثبت نشده‌اند؛ ادامه غیرفعال است.');
          nextButton.disabled = true;
          requestAnimationFrame(function () { requestAnimationFrame(hidePageLoader); });
        }
      };
      // Keep the full-page overlay visible throughout config fetch and JSONP loading.
      timeoutId = window.setTimeout(function () { showError('زمان دریافت اطلاعات به پایان رسید. لطفاً صفحه را دوباره بارگذاری کنید.'); }, 15000);
      fetch('config.txt?_=' + Date.now(), {cache:'no-store'})
        .then(function (response) {
          if (!response.ok) throw new Error('config fetch failed');
          return response.text();
        })
        .then(function (configText) {
          const configUrl = String(configText || '').trim();
          if (!configUrl) throw new Error('empty config');
          let endpoint;
          try { endpoint = new URL(configUrl); } catch (_) { throw new Error('invalid config URL'); }
          if (endpoint.protocol !== 'https:' || !endpoint.hostname || !endpoint.pathname.endsWith('/exec')) {
            throw new Error('invalid config URL');
          }
          const callback = endpoint.searchParams.get('callback');
          if (callback && callback !== 'qoranReceiveSettings') throw new Error('invalid callback');
          if (!callback) endpoint.searchParams.append('callback', 'qoranReceiveSettings');
          if (finished) return;
          const script = document.createElement('script');
          script.src = endpoint.toString() + '&_=' + Date.now();
          script.async = true;
          script.onerror = function () { showError('ارتباط با سرویس برقرار نشد. لطفاً بعداً دوباره تلاش کنید.'); };
          document.head.appendChild(script);
        })
        .catch(function () {
          showError('خطا در خواندن فایل تنظیمات (config.txt).');
        });
    }());
  </script>
</body>
</html>
